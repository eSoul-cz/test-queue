name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: testq tests and installer tests
        run: |
          python3 --version
          python3 -m unittest discover -s skills/test-queue/scripts -p 'test_*.py' -v
